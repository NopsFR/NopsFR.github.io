<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d9c69a" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#d9c69a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#050506"/>
  <ellipse cx="600" cy="230" rx="520" ry="300" fill="url(#glow)" filter="url(#soft)"/>

  <!-- fine architectural gridlines, echoing the app's own corridor layout -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="380" x2="150" y2="560"/>
    <line x1="450" y1="380" x2="450" y2="560"/>
    <line x1="750" y1="380" x2="750" y2="560"/>
    <line x1="1050" y1="380" x2="1050" y2="560"/>
  </g>

  <text x="600" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="10" fill="#ece9e1">MINDHOUSE</text>
  <text x="600" y="312" text-anchor="middle" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="15" letter-spacing="5" fill="#67665f">5 SYSTEMS ONLINE</text>

  <!-- five doorways, one per agent, each lit with its own accent -->
  <g font-family="Georgia, serif" font-size="26" text-anchor="middle">
    <g transform="translate(150,460)">
      <rect x="-58" y="-90" width="116" height="150" fill="none" stroke="#c98a4b" stroke-opacity="0.45"/>
      <rect x="-58" y="-90" width="116" height="150" fill="#c98a4b" fill-opacity="0.08"/>
      <text y="70" fill="#c98a4b">Mancy</text>
    </g>
    <g transform="translate(450,460)">
      <rect x="-58" y="-90" width="116" height="150" fill="none" stroke="#b4443c" stroke-opacity="0.45"/>
      <rect x="-58" y="-90" width="116" height="150" fill="#b4443c" fill-opacity="0.08"/>
      <text y="70" fill="#b4443c">Null</text>
    </g>
    <g transform="translate(600,430)">
      <rect x="-72" y="-120" width="144" height="180" fill="none" stroke="#d9c69a" stroke-opacity="0.6"/>
      <rect x="-72" y="-120" width="144" height="180" fill="#d9c69a" fill-opacity="0.12"/>
      <text y="70" fill="#d9c69a">Jarvis</text>
    </g>
    <g transform="translate(750,460)">
      <rect x="-58" y="-90" width="116" height="150" fill="none" stroke="#4a8fc0" stroke-opacity="0.45"/>
      <rect x="-58" y="-90" width="116" height="150" fill="#4a8fc0" fill-opacity="0.08"/>
      <text y="70" fill="#4a8fc0">Atlas</text>
    </g>
    <g transform="translate(1050,460)">
      <rect x="-58" y="-90" width="116" height="150" fill="none" stroke="#9585d6" stroke-opacity="0.45"/>
      <rect x="-58" y="-90" width="116" height="150" fill="#9585d6" fill-opacity="0.08"/>
      <text y="70" fill="#9585d6">Orbit</text>
    </g>
  </g>

  <text x="600" y="620" text-anchor="middle" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="13" letter-spacing="2" fill="#67665f">A CENTRAL INTELLIGENCE + FOUR SPECIALIST AGENTS · REAL LOCAL TOOL EXECUTION</text>
</svg>
